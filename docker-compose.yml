services:
  # Development service with hot reload
  cms:
    image: node:24-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    depends_on:
      postgres:
        condition: service_started
      rustfs:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    env_file:
      - apps/cms/.env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/spon
      - S3_ENDPOINT=http://rustfs:9000
    restart: unless-stopped

  # Astro web app
  web:
    image: node:24-alpine
    ports:
      - '4321:4321'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/apps/web
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && cd /home/node/app && pnpm install && cd /home/node/app/apps/web && pnpm dev --host"
    depends_on:
      - cms
    environment:
      - NODE_ENV=development
    restart: unless-stopped
  # Postgres
  postgres:
    image: postgres:17
    ports:
      # Accessible from the host at port :35433
      - '35435:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spon
    # Make sure log colors show up correctly
    tty: true
    volumes:
      - pgdata:/var/lib/postgresql/data

  # RustFS - S3-compatible object storage
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - '9000:9000'
      - '9001:9001'
    env_file:
      - apps/cms/.env
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY_ID}
      - RUSTFS_SECRET_KEY=${S3_SECRET_ACCESS_KEY}
      - RUSTFS_REGION=${S3_BUCKET_REGION:-lon-1}
      - RUSTFS_BUCKET=${S3_BUCKET:-uploads}
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    restart: unless-stopped

  # RustFS initialization - creates the uploads bucket
  rustfs-init:
    image: node:24-alpine
    depends_on:
      - rustfs
    env_file:
      - apps/cms/.env
    environment:
      - S3_BUCKET=${S3_BUCKET:-uploads}
      - S3_BUCKET_REGION=${S3_BUCKET_REGION:-lon-1}
      - S3_ENDPOINT=http://rustfs:9000
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./scripts/init-rustfs.sh:/init-rustfs.sh
    command: sh /init-rustfs.sh
    restart: on-failure

  # Plausible Analytics
  plausible_db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - plausible-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.3.3.102-alpine
    restart: always
    volumes:
      - plausible-event-data:/var/lib/clickhouse
      - plausible-event-logs:/var/log/clickhouse-server
      - ./files/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./files/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  plausible:
    image: ghcr.io/plausible/community-edition:v2.1.5
    restart: always
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    ports:
      - '8000:8000'
    depends_on:
      - plausible_db
      - plausible_events_db
    env_file:
      - .env
    environment:
      - BASE_URL=http://localhost:8000
      - DATABASE_URL=postgres://postgres:postgres@plausible_db:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://plausible_events_db:8123/plausible_events_db

volumes:
  data:
  pgdata:
  node_modules:
  rustfs_data:
    driver: local
  rustfs_logs:
    driver: local
  plausible-db-data:
    driver: local
  plausible-event-data:
    driver: local
  plausible-event-logs:
    driver: local
