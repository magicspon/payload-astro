name: Dokploy Deployment Workflow

on:
  workflow_run:
    workflows: ['Build Docker Image']
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR number
        id: pr
        run: |
          if [ "${{ github.event.workflow_run.event }}" == "pull_request" ]; then
            PR_NUMBER=$(jq -r '.pull_requests[0].number' <<< '${{ toJson(github.event.workflow_run) }}')
            echo "number=${PR_NUMBER}" >> $GITHUB_OUTPUT
            echo "is_pr=true" >> $GITHUB_OUTPUT
          else
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Debug - Check secrets availability
        run: |
          echo "Checking if secrets are available..."
          if [ -z "${{ secrets.DOKPLOY_AUTH_TOKEN }}" ]; then
            echo "❌ DOKPLOY_AUTH_TOKEN is empty or not set"
          else
            echo "✅ DOKPLOY_AUTH_TOKEN is set (length: ${#DOKPLOY_AUTH_TOKEN})"
          fi

          if [ -z "${{ secrets.DOKPLOY_APPLICATION_ID }}" ]; then
            echo "❌ DOKPLOY_APPLICATION_ID is empty or not set"
          else
            echo "✅ DOKPLOY_APPLICATION_ID is set"
          fi

          if [ -z "${{ secrets.DOKPLOY_URL }}" ]; then
            echo "❌ DOKPLOY_URL is empty or not set"
          else
            echo "✅ DOKPLOY_URL is set"
          fi

          echo "Is PR: ${{ steps.pr.outputs.is_pr }}"
          echo "PR Number: ${{ steps.pr.outputs.number }}"
        env:
          DOKPLOY_AUTH_TOKEN: ${{ secrets.DOKPLOY_AUTH_TOKEN }}

      - name: Dokploy Deployment
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: application
